version: '3.9'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: icarus-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: icarus-backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6G

  frontend:
    build: ./frontend
    container_name: icarus-frontend
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data: