services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: icarus-backend
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: icarus-frontend
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - backend
    restart: unless-stopped